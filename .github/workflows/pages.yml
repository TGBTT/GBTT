name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install marketing deps
        run: npm ci

      - name: Generate icons
        run: npm run icons

      - name: Ensure class images
        run: |
          if [ -f public/images/classes/sweat/card-480.jpg ]; then
            echo "Using committed class images from public/images/classes"
          else
            npm run class-images
          fi
          test -f public/images/classes/sweat/card-480.jpg

      - name: Reject placeholder Firebase secrets
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FORM_ENDPOINT: ${{ secrets.VITE_FORM_ENDPOINT }}
        run: |
          set -euo pipefail
          fail=0
          for var in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID; do
            val="${!var}"
            if [ -z "$val" ] || [ "$val" = "-" ]; then
              echo "::error::$var is missing or a placeholder. Run scripts/sync-github-secrets.ps1 -Repo TGBTT/GBTT"
              fail=1
            fi
          done
          if [ "${VITE_FORM_ENDPOINT:-}" = "-" ]; then
            echo "::error::VITE_FORM_ENDPOINT is a placeholder, not the Apps Script URL."
            fail=1
          fi
          if [ "$fail" -eq 1 ]; then
            exit 1
          fi

      - name: Build marketing site
        env:
          VITE_BASE: /
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FORM_ENDPOINT: ${{ secrets.VITE_FORM_ENDPOINT }}
        run: npm run build

      - name: Install apps deps
        working-directory: apps
        run: npm ci

      - name: Build apps
        working-directory: apps
        env:
          VITE_APP_BASE: /app/
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FORM_ENDPOINT: ${{ secrets.VITE_FORM_ENDPOINT }}
        run: npm run build

      - name: Assemble site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # Marketing build (cp -a with . preserves dotfiles such as .nojekyll)
          cp -a dist/. _site/

          if [ ! -f _site/images/classes/sweat/card-480.jpg ]; then
            echo "Class images missing from dist — copying from public/"
            mkdir -p _site/images
            cp -R public/images/classes _site/images/
          fi

          # Member/trainer apps at /app/
          mkdir -p _site/app
          cp -a apps/dist/. _site/app/
          mkdir -p _site/app/images
          cp -R apps/public/images/classes _site/app/images/

          # SPA deep links. Pages serves static files only, so every client
          # route needs its own index.html or it 404s before React loads.
          # Adding a route to App.tsx means adding it here too.
          mkdir -p _site/app/signin _site/app/fitness/studioflow _site/app/fitness/classboard
          cp _site/app/index.html _site/app/signin/index.html
          cp _site/app/index.html _site/app/fitness/studioflow/index.html
          cp _site/app/index.html _site/app/fitness/classboard/index.html
          for path in contact classes locations apps future; do
            mkdir -p "_site/$path"
            cp _site/index.html "_site/$path/index.html"
          done
          node scripts/patch-contact-html.mjs _site/contact/index.html

          # Custom domain + bypass Jekyll
          echo "gbtt.co.nz" > _site/CNAME
          touch _site/.nojekyll

      - name: Verify assembled site
        run: |
          set -euo pipefail
          echo "--- CNAME ---"
          cat _site/CNAME
          echo "--- required files ---"
          test -f _site/index.html
          test -f _site/app/index.html
          test -f _site/app/signin/index.html
          test -f _site/classes/index.html
          test -f _site/apps/index.html
          test -f _site/images/classes/sweat/card-480.jpg
          test -f _site/app/images/classes/sweat/card-480.jpg
          test -f _site/.nojekyll
          echo "--- crawler files (copied from public/ by the Vite build) ---"
          test -f _site/robots.txt
          test -f _site/sitemap.xml
          test -f _site/llms.txt
          grep -q 'https://gbtt.co.nz/contact/' _site/sitemap.xml
          echo "--- og:image must exist and be an absolute URL ---"
          test -f _site/og-image.png
          grep -q 'property="og:image" content="https://gbtt.co.nz/og-image.png"' _site/index.html
          grep -q 'property="og:image:width" content="1200"' _site/index.html
          echo "--- contact page must have its own canonical, not the home page ---"
          grep -q 'rel="canonical" href="https://gbtt.co.nz/contact/"' _site/contact/index.html
          grep -q '<title>Contact Tom | Golden Bay Team Training</title>' _site/contact/index.html
          grep -q 'rel="canonical" href="https://gbtt.co.nz/"' _site/index.html
          echo "--- favicons must be base-absolute so nested SPA copies still resolve ---"
          test -f _site/favicon.ico
          test -f _site/favicon-32x32.png
          test -f _site/apple-touch-icon.png
          test -f _site/app/favicon.ico
          grep -q 'rel="icon" href="/favicon.ico"' _site/index.html
          grep -q 'rel="icon" href="/favicon.ico"' _site/contact/index.html
          grep -q 'rel="icon" href="/app/favicon.ico"' _site/app/index.html
          grep -q 'rel="icon" href="/app/favicon.ico"' _site/app/fitness/studioflow/index.html
          grep -q 'rel="icon" href="/app/favicon.ico"' _site/app/signin/index.html
          echo "--- built assets (styles/scripts must exist) ---"
          ls -1 _site/assets/*.css _site/assets/*.js
          ls -1 _site/app/assets/*.css _site/app/assets/*.js
          echo "--- asset paths referenced by index.html must be root-absolute ---"
          grep -o 'href="/assets/[^"]*\.css"' _site/index.html
          grep -o 'src="/assets/[^"]*\.js"' _site/index.html
          grep -o 'href="/app/assets/[^"]*\.css"' _site/app/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
